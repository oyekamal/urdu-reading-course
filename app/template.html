<meta charset="utf-8">
<title>Urdu Reading Course</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Public+Sans:wght@400;600;800&display=swap">
<style>
:root{--paper:#f4f6f8;--card:#ffffff;--ink:#14213d;--muted:#5d6675;--line:#d9dee6;--accent:#0f7b6c;--accent-ink:#ffffff;--soft:#e3f2ee;--warn:#b7791f;--good:#2f855a;--bad:#c53030;--urdu-naskh:"Noto Naskh Arabic",serif;--urdu-nastaliq:"Noto Nastaliq Urdu",serif;--sans:"Public Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11161f;--card:#1a212c;--ink:#eef1f5;--muted:#a0a8b5;--line:#2c3542;--accent:#3fb59f;--accent-ink:#0b1310;--soft:#17362f;--warn:#e0a33a;--good:#5cbf83;--bad:#f07070}}
:root[data-theme="dark"]{--paper:#11161f;--card:#1a212c;--ink:#eef1f5;--muted:#a0a8b5;--line:#2c3542;--accent:#3fb59f;--accent-ink:#0b1310;--soft:#17362f;--warn:#e0a33a;--good:#5cbf83;--bad:#f07070}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);padding-inline:16px;padding-block:0 24px}
h1,h2,h3{text-wrap:balance;margin:0}
.ur{font-family:var(--urdu-naskh);direction:rtl;unicode-bidi:isolate;line-height:1.9}
body[data-style="nastaliq"] .ur{font-family:var(--urdu-nastaliq);line-height:2.2}
.wrap{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:230px 1fr;gap:24px;align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-block:18px 8px;border-bottom:1px solid var(--line)}
header h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
header .ur{font-size:26px;color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:focus-visible,select:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.play{border-radius:999px;width:34px;height:34px;padding:0;display:inline-grid;place-items:center;color:var(--accent);border-color:var(--accent);background:transparent}
button.play.small{width:26px;height:26px;font-size:11px}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 20px);overflow:auto}
@media (max-width:760px){nav{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px;mask-image:linear-gradient(90deg,#000 85%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)} nav::after{content:'→ more units';flex:none;color:var(--muted);font-size:12px;align-self:center;padding:0 40px 0 8px}}
nav button{text-align:left;display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-color:transparent;background:transparent;white-space:nowrap}
nav button .n{font-variant-numeric:tabular-nums;color:var(--muted);width:1.6em;font-weight:600}
nav button.cur{background:var(--card);border-color:var(--line)}
nav button.done .n{color:var(--good)}
nav button.locked{opacity:.55}
main{display:grid;gap:18px;min-width:0}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
section h2{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
section h2 .tag{font-weight:400;letter-spacing:0;text-transform:none;font-size:12px}
.unit-head h2{font-size:26px;text-transform:none;letter-spacing:-.01em;color:var(--ink);display:block}
.unit-head .ur{font-size:30px;display:block;margin-top:2px}
.unit-head p{color:var(--muted);margin:8px 0 0;max-width:65ch}
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.letter{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start}
.letter .big{font-size:64px;line-height:1.1;grid-row:span 3;text-align:center;min-width:72px}
.letter .name{font-weight:800}.letter .ipa{color:var(--muted);font-size:14px}
.letter .hint{font-size:14px;grid-column:1/-1}.letter .ex{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.letter .ex .ur{font-size:24px}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;direction:rtl;margin-top:8px}
.forms div{text-align:center;border-top:1px solid var(--line);padding-top:6px}
.forms .g{font-size:44px;line-height:1.3}.forms small{display:block;color:var(--muted);font-size:11px;direction:ltr}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
.drill{display:grid;gap:12px}
.choices{display:flex;flex-wrap:wrap;gap:10px;direction:rtl}
.tile{font-size:44px;line-height:1.2;min-width:78px;padding:10px 16px;border:2px solid var(--line);border-radius:12px;background:var(--paper);cursor:pointer;color:var(--ink)}
.tile.small{font-size:30px;min-width:56px;padding:6px 12px}
.tile.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--card))}
.tile.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.score{font-weight:600;font-variant-numeric:tabular-nums}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.word{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px;position:relative}
.word .ur{font-size:34px}.word .rom{font-size:13px;color:var(--muted)}.word .en{font-size:13px}
.word .play{position:absolute;top:8px;left:8px}
body[data-track="heritage"] .rom{display:none}
.sent{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
.sent .ur{font-size:30px;flex:1;min-width:200px;text-align:right}.sent .rom{color:var(--muted);font-size:13px}
.build{display:grid;gap:10px}.build .target{font-size:56px;min-height:1.5em;text-align:right;border-bottom:2px dashed var(--line)}
canvas{border:1px solid var(--line);border-radius:10px;background:var(--card);touch-action:none;max-width:100%}
.trace{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.keys{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.keys .tile{font-size:28px;min-width:50px;padding:6px 10px}
.answer{font-size:44px;min-height:1.4em;text-align:right;border-bottom:2px solid var(--line)}
.quiz ol{padding-left:20px;display:grid;gap:12px;margin:0}.quiz li{display:grid;gap:6px}
.quiz .choices{direction:rtl;justify-content:flex-start}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td .ur{font-size:24px}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--soft);color:var(--accent);font-weight:600}
.big-ur{font-size:60px;text-align:center}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare div{border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.compare .ur{font-size:40px}
.timer{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.grid-ur{display:flex;flex-wrap:wrap;gap:14px 22px;direction:rtl;font-size:34px;line-height:1.4}
.footer{grid-column:1/-1;color:var(--muted);font-size:13px;padding-top:12px;border-top:1px solid var(--line)}
.footer a{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .08s}.tile:active{transform:scale(.96)}}
</style>
<div class="wrap">
<header>
  <div><h1>Urdu Reading Course</h1><span class="ur">اردو پڑھنا سیکھیں</span></div>
  <div class="controls">
    <label>Track <select id="track"><option value="child">Child (5–10)</option><option value="adult" selected>Adult, new to Urdu</option><option value="heritage">Speaks Urdu, can't read</option></select></label>
    <label>Script <select id="style"><option value="naskh">Naskh (learning)</option><option value="nastaliq">Nastaliq (print)</option></select></label>
    <label><input type="checkbox" id="marks" checked> vowel marks</label>
    <button id="reset">Reset progress</button>
  </div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="footer">Audio is machine voice (Meta MMS-TTS Urdu, local). Cards, order and drills follow the evidence in <code>course/00_design.md</code>. Vowel marks stay on until unit 11 on purpose.</div>
</div>
<script>
const DATA = /*__DATA__*/null;
const STROKE={alif:'one stroke, top to bottom',be:'start top-right, shallow bowl leftwards, hook up; dots last',jim:'small head stroke leftwards, then the round bowl below; dot last',dal:'top down and out to the left in one angled stroke',re:'top down and sweep left below the line',sin:'three teeth right to left, then the bowl',toe:'loop first, then the tall stroke on its right',ain:'small c at the top, then the bowl',fe:'small loop, then the bowl leftwards',kaf:'sloping cap first, then the base leftwards',lam:'tall stroke down, curve into the bowl',mim:'small loop, tail down-left',nun:'deep round bowl; dot last',wao:'small loop, short tail',he:'small loop with a short tail (ھ: two bowls open at top)',ye:'bowl that swings back under itself (ے: long flat sweep)',hamza:'small hook, written last'};
const L = DATA.letters.letters, BY = Object.fromEntries(L.map(l=>[l.ch,l])), UNITS = DATA.units;
const TATWEEL="ـ", MN=/[ً-ْٰٔ٘]/g;
let AUDIO = {}; fetch('audio.json').then(r=>r.json()).then(a=>{AUDIO=a;}).catch(()=>{});
const store = {get(k,d){try{const v=localStorage.getItem('urc.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('urc.'+k,JSON.stringify(v))}catch(e){}}};
let progress = store.get('progress',{}), cur = store.get('unit',0);
const h=parseInt((location.hash||'').replace('#unit-','')); if(!isNaN(h)&&h>=0&&h<=12) cur=h;
window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.replace('#unit-','')); if(!isNaN(n)&&n!==cur&&n>=0&&n<=12){cur=n;store.set('unit',cur);render();}});
const player = new Audio();
function play(key){const src=AUDIO[key]; if(!src){toast('Audio still loading…');return;} player.src=src; player.play().catch(()=>{});}
function toast(m){const t=document.getElementById('toast')||Object.assign(document.body.appendChild(document.createElement('div')),{id:'toast'}); t.textContent=m; t.style.cssText='position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;z-index:9'; clearTimeout(t._h); t._h=setTimeout(()=>t.remove(),1800);}
const W = w => ({ur:w[0],rom:w[1],en:w[2],v:w[3]||w[0]});
const showMarks = () => document.getElementById('marks').checked;
const disp = w => showMarks()? w.v : w.ur;
const shuffle = a => a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const taughtBefore = n => new Set(UNITS.filter(u=>u.n<n).flatMap(u=>u.letters));
const el = (t,c,h) => {const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const playBtn = (key,small) => {const b=el('button','play'+(small?' small':''),'▶'); b.title='Play'; b.setAttribute('aria-label','Play audio'); b.onclick=e=>{e.stopPropagation();play(key)}; return b;};

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  UNITS.forEach(u=>{
    const b=el('button','', `<span class="n">${u.n}</span><span>${u.title}</span>`); b.setAttribute('aria-label',`Unit ${u.n}: ${u.title}`);
    const done = progress[u.n]?.passed; const locked = u.n>0 && !progress[u.n-1]?.passed && !done && u.n!==cur;
    if(done) b.classList.add('done'); if(locked) b.classList.add('locked'); if(u.n===cur){ b.classList.add('cur'); b.setAttribute('aria-current','page'); }
    b.onclick=()=>{ if(locked && !confirm('Unit '+(u.n-1)+' is not passed yet. Open unit '+u.n+' anyway?')) return; cur=u.n; store.set('unit',cur); render(); };
    nav.appendChild(b);
  });
}

function formsHTML(l){
  const j=l.joiner;
  const f=[['isolated',l.ch],['initial',j?l.ch+TATWEEL:null],['medial',j?TATWEEL+l.ch+TATWEEL:null],['final',TATWEEL+l.ch]];
  return `<div class="forms">${f.map(([n,s])=>`<div><span class="g ur">${s??'—'}</span><small>${n}${s?'':' (none)'}</small></div>`).join('')}</div>`;
}

function secHear(u){
  const s=el('section'); s.innerHTML='<h2>1 · Hear it <span class="tag">name → sound → example word</span></h2>';
  const g=el('div','letters');
  u.letters.map(c=>BY[c]).filter(Boolean).forEach(l=>{
    const d=el('div','letter');
    d.innerHTML=`<div class="big ur">${l.ch}</div><div class="name">${l.name} <span class="ur" style="font-size:20px;color:var(--muted)">${l.name_ur}</span></div><div class="ipa">/${l.ipa}/</div><div class="hint">${l.hint}</div>
      <div class="ex"><span class="ur">${l.example[0]}</span><span class="rom">${l.example[1]}</span><span>— ${l.example[2]}</span></div>
      <div class="note">✎ ${STROKE[l.family]||'body first in one stroke, right to left; dots last'}</div>
      <div class="note">${l.joiner?'joins forward · 4 forms':'does <b>not</b> join forward · 2 forms'}${l.never_initial?' · never starts a word':''}${l.loan?' · '+l.loan+' loanwords':''}</div>`;
    const bar=el('div','ex'); bar.append('name ',playBtn('names/'+l.id,true),' word ',playBtn('words/'+l.id,true));
    if(l.role==='consonant'&&!l.never_initial){ bar.append(' syllables '); [['a','ا'],['i','ی'],['u','و']].forEach(([t,v])=>{const b=el('button','','<span class="ur">'+l.ch+v+'</span>'); b.style.fontSize='18px'; b.onclick=()=>play(`syllables/${l.id}_${t}`); bar.append(b);}); }
    d.append(bar); d.insertAdjacentHTML('beforeend',formsHTML(l)); g.append(d);
  });
  s.append(g); return s;
}

function secTellApart(u){
  const s=el('section'); s.innerHTML='<h2>3 · Tell it apart <span class="tag">tap what you hear · 10 rounds</span></h2>';
  const have = new Set([...taughtBefore(u.n),...u.letters]);
  let pool = [...new Set(u.letters.flatMap(c=>[c,...(BY[c]?.confusable||[])]))].filter(c=>have.has(c)&&BY[c]);
  const recall=shuffle([...taughtBefore(u.n)].filter(c=>BY[c]&&!pool.includes(c))).slice(0,2); pool=[...pool,...recall];
  if(pool.length<2){ s.append(el('p','note','No new look-alikes here. Re-run unit 2 (ب ت ن ی) as a warm-up.')); return s; }
  const box=el('div','drill'); let round=0,score=0,target;
  const status=el('div','score'), choices=el('div','choices'), btn=el('button','primary','Play sound');
  function next(){ if(round>=10){status.textContent=`Done: ${score}/10`; choices.innerHTML=''; btn.textContent='Again'; btn.onclick=()=>{round=0;score=0;next();}; return;}
    round++; target=pool[Math.floor(Math.random()*pool.length)]; status.textContent=`Round ${round}/10 · score ${score}`;
    const shown=shuffle([target,...shuffle(pool.filter(c=>c!==target)).slice(0,5)]); choices.innerHTML=''; shown.forEach(c=>{const t=el('button','tile ur',c); t.onclick=()=>{ if(c===target){t.classList.add('ok');score++;setTimeout(next,500);} else {t.classList.add('no'); play('names/'+BY[c].id);} }; choices.append(t);});
    play('names/'+BY[target].id); btn.textContent='Play again'; btn.onclick=()=>play('names/'+BY[target].id);
  }
  btn.onclick=next; box.append(status,btn,choices); s.append(box); return s;
}

function secJoin(u){
  const words=u.words.map(W).filter(w=>w.ur.length>=3).slice(0,6); if(!words.length) return null;
  const s=el('section'); s.innerHTML='<h2>4 · Join it <span class="tag">build the word from tiles, right to left</span></h2>';
  const b=el('div','build'), target=el('div','target ur'), tiles=el('div','choices'), info=el('div','note'), nextB=el('button','','Next word'); let i=0,cur='';
  function load(){ const w=words[i%words.length]; cur=''; target.textContent=''; info.innerHTML=`Make: <b>${w.rom}</b> — ${w.en} `; info.append(playBtn('units/u'+String(u.n).padStart(2,'0')+'_'+String(u.words.findIndex(x=>x[0]===w.ur)).padStart(2,'0'),true));
    tiles.innerHTML=''; shuffle([...w.ur]).forEach(c=>{const t=el('button','tile small ur',c); t.onclick=()=>{ if(w.ur[cur.length]===c){cur+=c;target.textContent=cur;t.disabled=true;t.classList.add('ok'); if(cur===w.ur){toast('Correct: '+w.rom); target.textContent=showMarks()?w.v:w.ur;}} else {t.classList.add('no');setTimeout(()=>t.classList.remove('no'),400);} }; tiles.append(t);}); }
  nextB.onclick=()=>{i++;load();}; load(); b.append(info,target,tiles,nextB); s.append(b); return s;
}

function secRead(u){
  if(!u.words.length) return null;
  const s=el('section'); s.innerHTML=`<h2>5 · Read it <span class="tag">${u.words.length} words · read aloud, then listen</span></h2>`;
  const g=el('div','words'); const p=String(u.n).padStart(2,'0');
  u.words.map(W).forEach((w,i)=>{const d=el('div','word'); d.innerHTML=`<div class="ur">${disp(w)}</div><div class="rom">${w.rom}</div><div class="en">${w.en}</div>`; d.append(playBtn(`units/u${p}_${String(i).padStart(2,'0')}`,true)); d.onclick=()=>play(`units/u${p}_${String(i).padStart(2,'0')}`); g.append(d);});
  s.append(g);
  if(u.sentences.length){ const h=el('h3','',''); h.style.cssText='margin:16px 0 4px;font-size:14px;color:var(--muted)'; h.textContent='Sentences'; s.append(h);
    u.sentences.map(W).forEach((w,i)=>{const d=el('div','sent'); d.append(playBtn(`sentences/u${p}_${String(i).padStart(2,'0')}`)); d.insertAdjacentHTML('beforeend',`<span class="ur">${disp(w)}</span><span class="rom">${w.rom}</span><span>${w.en}</span>`); s.append(d);}); }
  return s;
}

function secWrite(u){
  const ls=u.letters.map(c=>BY[c]).filter(Boolean); if(!ls.length) return null;
  const s=el('section'); s.innerHTML='<h2>6 · Write it <span class="tag">trace over the grey letter · aim for 80%</span></h2>';
  const row=el('div','trace'), sel=el('select'), formSel=el('select'), cv=el('canvas'), out=el('div','score'), clear=el('button','','Clear'), check=el('button','primary','Check');
  ls.forEach(l=>sel.append(new Option(l.name+' '+l.ch,l.ch))); ['isolated','initial','medial','final'].forEach(f=>formSel.append(new Option(f,f)));
  cv.width=360; cv.height=300; cv.setAttribute('role','img'); cv.setAttribute('aria-label','Tracing area: draw over the grey letter'); const ctx=cv.getContext('2d',{willReadFrequently:true}); let ref=null, drawing=false, startX=null, glyphBox=null;
  function glyph(){const l=BY[sel.value],f=formSel.value; if(!l.joiner&&(f==='initial'||f==='medial')) return null; return f==='isolated'?l.ch:f==='initial'?l.ch+TATWEEL:f==='medial'?TATWEEL+l.ch+TATWEEL:TATWEEL+l.ch;}
  function base(){ ctx.clearRect(0,0,cv.width,cv.height); const g=glyph(); out.textContent=''; if(!g){ctx.fillStyle='#888';ctx.font='16px sans-serif';ctx.fillText('This letter has no such form',60,150);ref=null;return;}
    const fam=document.body.dataset.style==='nastaliq'?'"Noto Nastaliq Urdu"':'"Noto Naskh Arabic"'; ctx.fillStyle='#c9ced6'; ctx.font=`170px ${fam}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.direction='rtl'; ctx.fillText(g,180,150); ref=ctx.getImageData(0,0,cv.width,cv.height).data; let minx=cv.width,maxx=0; for(let i=3;i<ref.length;i+=4){ if(ref[i]>0){const x=(i>>2)%cv.width; if(x<minx)minx=x; if(x>maxx)maxx=x;} } glyphBox=[minx,maxx]; startX=null; }
  const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{drawing=true;const q=pos(e); if(startX===null) startX=q[0]; ctx.beginPath();ctx.moveTo(...q);cv.setPointerCapture(e.pointerId)}; cv.onpointermove=e=>{if(!drawing)return;ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent');ctx.lineWidth=14;ctx.lineCap='round';ctx.lineJoin='round';ctx.lineTo(...pos(e));ctx.stroke()}; cv.onpointerup=cv.onpointercancel=()=>drawing=false;
  check.onclick=()=>{ if(!ref)return; const now=ctx.getImageData(0,0,cv.width,cv.height).data; let g=0,hit=0,stray=0; for(let i=0;i<ref.length;i+=4){const isG=ref[i+3]>0; const drawn=Math.abs(now[i]-ref[i])>40||Math.abs(now[i+1]-ref[i+1])>40||(now[i+3]>0&&ref[i+3]===0); if(isG){g++; if(drawn)hit++;} else if(drawn) stray++;} const cov=Math.round(100*hit/Math.max(1,g)); const neat=stray<g*0.8; const rtl = startX===null || !glyphBox || startX > (glyphBox[0]+glyphBox[1])/2; out.textContent=`Coverage ${cov}% ${cov>=80&&neat&&rtl?'✓ good':cov<80?'— keep tracing':!rtl?'— start on the right side; Urdu is written right to left':'— stay inside the letter'}`; };
  clear.onclick=base; sel.onchange=formSel.onchange=base; document.getElementById('style').addEventListener('change',base);
  const side=el('div','drill'); side.append(sel,formSel,check,clear,out); row.append(cv,side); s.append(row); base(); return s;
}

function secDictation(u){
  if(u.words.length<5) return null;
  const s=el('section'); s.innerHTML='<h2>7 · Dictation <span class="tag">hear a word, spell it with the tiles · 5 words</span></h2>';
  const p=String(u.n).padStart(2,'0'), keysAll=[...new Set([...taughtBefore(u.n),...u.letters])].filter(c=>BY[c]);
  const box=el('div','drill'), ans=el('div','answer ur'), keys=el('div','keys'), status=el('div','score'), playB=el('button','primary','Play word'), checkB=el('button','','Check'), back=el('button','','⌫'), skipB=el('button','','Skip');
  let items=shuffle(u.words.map((w,i)=>({w:W(w),i}))).slice(0,5), k=0, typed='', score=0;
  keysAll.forEach(c=>{const t=el('button','tile ur',c); t.onclick=()=>{typed+=c;ans.textContent=typed;}; keys.append(t);});
  ['ء','ئ','ؤ','آ'].forEach(c=>{if(u.n>=10){const t=el('button','tile ur',c);t.onclick=()=>{typed+=c;ans.textContent=typed;};keys.append(t);}});
  back.onclick=()=>{typed=[...typed].slice(0,-1).join('');ans.textContent=typed;};
  const key=()=>`units/u${p}_${String(items[k].i).padStart(2,'0')}`;
  function show(){ if(k>=items.length){status.textContent=`Done: ${score}/5`; playB.textContent='Again'; playB.onclick=()=>{items=shuffle(u.words.map((w,i)=>({w:W(w),i}))).slice(0,5);k=0;score=0;typed='';ans.textContent='';show();}; return;} typed=''; ans.textContent=''; status.textContent=`Word ${k+1}/5 · score ${score}`; playB.textContent='Play word'; playB.onclick=()=>play(key()); play(key()); }
  checkB.onclick=()=>{ const w=items[k].w; if(typed===w.ur){score++; ans.textContent=w.v; toast('Correct — '+w.rom+' ('+w.en+')'); k++; setTimeout(show,900);} else {ans.classList.add('no'); setTimeout(()=>ans.classList.remove('no'),500); toast('Not yet. Listen again.');} };
  skipB.onclick=()=>{toast('It was '+items[k].w.v+' — '+items[k].w.rom); k++; setTimeout(show,900);};
  const bar=el('div','choices'); bar.style.direction='ltr'; bar.append(playB,checkB,back,skipB,status);
  box.append(bar,ans,keys); s.append(box); show(); return s;
}

function secQuiz(u){
  if(u.words.length<4) return null;
  const s=el('section','quiz'); s.innerHTML='<h2>8 · Check <span class="tag">score 8/10 to unlock the next unit</span></h2>';
  const ol=el('ol'); const qs=shuffle(u.words.map(W)).slice(0,10); const picks={};
  qs.forEach((w,qi)=>{ const li=el('li'); li.innerHTML=`Which one says <b>${w.rom}</b> (${w.en})?`; const ch=el('div','choices'); const opts=shuffle([w,...shuffle(u.words.map(W).filter(x=>x.ur!==w.ur)).slice(0,3)]);
    opts.forEach(o=>{const t=el('button','tile small ur',disp(o)); t.onclick=()=>{[...ch.children].forEach(c=>c.classList.remove('ok'));t.classList.add('ok');picks[qi]=o.ur;}; ch.append(t);}); li.append(ch); ol.append(li); });
  const submit=el('button','primary','Submit'), res=el('div','score');
  submit.onclick=()=>{ let sc=0; qs.forEach((w,qi)=>{ if(picks[qi]===w.ur) sc++; }); res.textContent=`Score ${sc}/10 ${sc>=8?'— passed ✓':'— review steps 3, 5 and 7, then try again'}`; qs.forEach((w,qi)=>{ [...ol.children[qi].querySelectorAll('.tile')].forEach(t=>{ const isRight=t.textContent===disp(w); t.classList.toggle('ok',isRight); if(!isRight && t.classList.contains('ok')===false && picks[qi] && t.textContent===disp(u.words.map(W).find(x=>x.ur===picks[qi])||{})) t.classList.add('no'); }); }); progress[u.n]={...(progress[u.n]||{}),score:sc,passed:sc>=8||progress[u.n]?.passed}; store.set('progress',progress); renderNav(); };
  s.append(ol,submit,res); return s;
}

function secUnit0(){
  const d=DATA.letters; const nj='ا د ڈ ذ ر ڑ ز ژ و ے';
  const s=el('section'); s.innerHTML=`<h2>Five things to know before letter one</h2>
  <ol style="display:grid;gap:8px;padding-left:20px;max-width:70ch">
  <li><b>Urdu is read right to left.</b> The first letter of a word is on the right. Numbers still run left to right.</li>
  <li><b>Letters join like cursive.</b> Most letters change shape by position: alone, first, middle, last. Ten letters never join to the letter after them: <span class="ur" style="font-size:24px">${nj}</span>. After one of these the word restarts.</li>
  <li><b>Dots decide the letter.</b> <span class="ur" style="font-size:24px">ب پ ت ٹ ث ن ی</span> share one body; dots (and the small ط-mark) tell them apart.</li>
  <li><b>Small marks are vowels.</b> Short a / i / u are marks above or below the letter. Adult books drop them; we keep them until unit 11.</li>
  <li><b>Two typefaces, one alphabet.</b> Print uses Nastaliq (sloping, stacked). Screens and Arabic use Naskh (on a line). Use the Script switch above to see both.</li></ol>
  <h3 style="margin:18px 0 6px;font-size:14px;color:var(--muted)">Vowel marks</h3><div class="tablewrap"><table><tr><th>Mark</th><th>Name</th><th>Sound</th><th>Example</th><th></th></tr>
  ${d.diacritics.map(x=>`<tr><td><span class="ur">بـ${x.ch}</span></td><td>${x.name} <span class="ur" style="font-size:18px">${x.name_ur}</span></td><td>${x.sound}</td><td><span class="ur">${x.example[0]}</span> ${x.example[1]} — ${x.example[2]}</td><td id="dia-${x.id}"></td></tr>`).join('')}</table></div>
  <h3 style="margin:18px 0 6px;font-size:14px;color:var(--muted)">Long vowels</h3><div class="tablewrap"><table><tr><th>Letter</th><th>Sound</th><th>Example</th></tr>${d.long_vowels.map(x=>`<tr><td><span class="ur">${x[0]}</span></td><td>${x[1]}</td><td><span class="ur">${x[2].split(' ')[0]}</span> ${x[2].split(' ').slice(1).join(' ')}</td></tr>`).join('')}</table></div>
  <h3 style="margin:18px 0 6px;font-size:14px;color:var(--muted)">Numerals</h3><div class="grid-ur">${d.numerals.map((x,i)=>`<span>${x[0]}<small style="font-family:var(--sans);font-size:13px;color:var(--muted)"> ${x[1]}</small></span>`).join('')}</div>`;
  d.diacritics.forEach(x=>{const c=s.querySelector('#dia-'+x.id); c.append(playBtn('diacritics/'+x.id,true),' ',playBtn('diacritics/'+x.id+'_ex',true));});
  return s;
}

function secAspirates(){
  const s=el('section'); s.innerHTML='<h2>Aspirates and the nasal vowel</h2><p class="note" style="max-width:70ch">Write دو چشمی ہے (ھ) after a consonant to add a puff of breath. English already has it: the p in <i>pin</i> is aspirated, the p in <i>spin</i> is not. ں nasalises the vowel before it like French <i>bon</i>.</p>';
  const t=el('div','tablewrap'); t.innerHTML=`<table><tr><th>Pair</th><th>Say</th><th>Word</th><th>Means</th><th></th></tr>${DATA.letters.aspirates.map(a=>`<tr><td><span class="ur">${a[0]}</span></td><td>${a[1]}</td><td><span class="ur">${a[2]}</span> <span class="rom">${a[3]}</span></td><td>${a[4]}</td><td id="asp-${a[1].replace(/[^a-z]/g,'_')}"></td></tr>`).join('')}</table>`;
  s.append(t); DATA.letters.aspirates.forEach(a=>{const id=[...a[1]].map(c=>/[a-z0-9]/i.test(c)?c:'_').join(''); s.querySelector('#asp-'+a[1].replace(/[^a-z]/g,'_'))?.append(playBtn('aspirates/'+id,true));}); return s;
}

function secUnit11(){
  const s=el('section'); s.innerHTML='<h2>Sight words <span class="tag">these 20 words are a third of any Urdu text</span></h2>';
  const g=el('div','words'); DATA.letters.sight_words.forEach((w,i)=>{const d=el('div','word'); d.innerHTML=`<div class="ur">${w}</div>`; d.append(playBtn('sight/'+String(i).padStart(2,'0'),true)); d.onclick=()=>play('sight/'+String(i).padStart(2,'0')); g.append(d);}); s.append(g);
  const c=el('section'); c.innerHTML='<h2>Naskh → Nastaliq <span class="tag">same letters, new slope</span></h2><p class="note">Letters stack from upper-right to lower-left, dots slide along the stroke, final ی and ے dip below the line. Nothing about the letter identity or its dots changes.</p>';
  const cmp=el('div','compare'); ['کتاب','پڑھنا','بچّہ','میں گھر میں ہوں','لڑکی اسکول جاتی ہے'].forEach(w=>{cmp.insertAdjacentHTML('beforeend',`<div><small>Naskh</small><div class="ur" style="font-family:var(--urdu-naskh)">${w}</div></div><div><small>Nastaliq</small><div class="ur" style="font-family:var(--urdu-nastaliq);line-height:2.2">${w}</div></div>`);}); c.append(cmp);
  const o=el('section'); o.innerHTML=`<h2>Dictionary order <span class="tag">course order was for speed; dictionaries use this</span></h2><div class="grid-ur">${'ا ب پ ت ٹ ث ج چ ح خ د ڈ ذ ر ڑ ز ژ س ش ص ض ط ظ ع غ ف ق ک گ ل م ن و ہ ھ ء ی ے'.split(' ').map(c=>`<span>${c}</span>`).join('')}</div><p class="note">Marks come off in this unit: untick "vowel marks" above and re-read the earlier units' words. If a made-up word still decodes without marks, you are ready.</p>`;
  const f=document.createDocumentFragment(); f.append(s,c,o); return f;
}

function secTest(){
  const s=el('section'); s.innerHTML='<h2>Reading test <span class="tag">EGRA-style · one-to-one · a helper times and counts</span></h2>';
  const allWords=UNITS.flatMap(u=>u.words.map(W)); const nonwords=['نَبَل','تیمو','کُدار','سَپون','مِلاک','بَٹری','گوناش','دِرَپ','چَکول','زیمار','فَلوت','ہَبیک','رونَل','ٹِکاس','جَمود','شَبیل','قَدور','پَلیش','بُکار','لَمیر'];
  const passage='میرا نام کمال ہے۔ میں لاہور میں رہتا ہوں۔ میرے گھر کے پاس ایک باغ ہے۔ صبح میں باغ میں چلتا ہوں۔ باغ میں پھول اور درخت ہیں۔ میری بہن بھی میرے ساتھ آتی ہے۔ ہم گلاب کے پھول دیکھتے ہیں۔ شام کو ہم گھر واپس جاتے ہیں اور چائے پیتے ہیں۔';
  const qs=['کمال کہاں رہتا ہے؟','کمال صبح کیا کرتا ہے؟','باغ میں کیا ہے؟','کمال کے ساتھ کون آتی ہے؟','شام کو وہ کیا پیتے ہیں؟'];
  const parts=[['1 · Letter sounds (60 s)',shuffle(L.map(l=>l.ch).concat(L.map(l=>l.ch))).slice(0,100).join(' ')],['2 · Nonwords (60 s)',nonwords.join('  ')],['3 · Familiar words (60 s)',shuffle(allWords).slice(0,50).map(w=>w.ur).join('  ')],['4 · Passage (time it)',passage],['5 · Comprehension',qs.join('  ')]];
  parts.forEach(([t,body])=>{s.insertAdjacentHTML('beforeend',`<h3 style="margin:16px 0 6px;font-size:14px;color:var(--muted)">${t}</h3><div class="grid-ur" style="font-size:28px">${body}</div>`);});
  const calc=el('div','drill'); calc.innerHTML='<h3 style="font-size:14px;color:var(--muted)">Score the passage</h3><label>Words read correctly <input id="cw" type="number" min="0" value="0"></label> <label>Seconds taken <input id="cs" type="number" min="1" value="60"></label> <button id="cb" class="primary">Compute cwpm</button> <div id="cr" class="score"></div>';
  s.append(calc); calc.querySelector('#cb').onclick=()=>{const cw=+calc.querySelector('#cw').value, cs=+calc.querySelector('#cs').value||60; const cwpm=Math.round(cw*60/cs); const lvl=cwpm>90?'exceeds grade-2 standard':cwpm>=60?'meets standard':cwpm>0?'below standard — repeat the units flagged in parts 1–3':'nonreader — restart at unit 1'; calc.querySelector('#cr').textContent=`${cwpm} cwpm — ${lvl}`; progress[12]={...(progress[12]||{}),cwpm,passed:cwpm>=60}; store.set('progress',progress); renderNav();};
  s.insertAdjacentHTML('beforeend','<div class="tablewrap" style="margin-top:12px"><table><tr><th>cwpm</th><th>Level</th></tr><tr><td>&gt; 90</td><td>exceeds grade-2 standard</td></tr><tr><td>60–90</td><td>meets standard</td></tr><tr><td>1–59</td><td>below standard</td></tr><tr><td>0</td><td>nonreader</td></tr></table></div><p class="note">Benchmarks from the USAID Pakistan Reading Project endline (see course/00_design.md, row 13).</p>');
  return s;
}

function render(){
  renderNav(); const u=UNITS[cur]; if(location.hash!=='#unit-'+cur) history.replaceState(null,'','#unit-'+cur); const m=document.getElementById('main'); m.innerHTML='';
  const head=el('section','unit-head'); head.innerHTML=`<span class="pill">Unit ${u.n}</span>${progress[u.n]?.passed?' <span class="pill">passed</span>':''}<h2>${u.title}</h2><span class="ur">${u.title_ur}</span><p>${u.focus}</p>`; m.append(head);
  if(u.n===0){ m.append(secUnit0()); }
  if(u.letters.length){ m.append(secHear(u)); }
  if(u.n===6) m.append(secAspirates());
  if(u.letters.length) m.append(secTellApart(u));
  [secJoin,secRead,secWrite,secDictation,secQuiz].forEach(f=>{const x=f(u); if(x) m.append(x);});
  if(u.n===11) m.append(secUnit11());
  if(u.n===12) m.append(secTest());
  if(u.n===0){ const go=el('button','primary','Start unit 1'); go.onclick=()=>{progress[0]={passed:true};store.set('progress',progress);cur=1;store.set('unit',1);render();}; m.append(go); }
  window.scrollTo({top:0});
}
const trackSel=document.getElementById('track'), styleSel=document.getElementById('style'), marksCb=document.getElementById('marks');
trackSel.value=store.get('track','adult'); styleSel.value=store.get('style','naskh'); marksCb.checked=store.get('marks',true);
function applySettings(){document.body.dataset.track=trackSel.value; document.body.dataset.style=styleSel.value; store.set('track',trackSel.value); store.set('style',styleSel.value); store.set('marks',marksCb.checked);}
trackSel.onchange=()=>{applySettings();render();}; styleSel.onchange=()=>{applySettings();}; marksCb.onchange=()=>{applySettings();render();};
document.getElementById('reset').onclick=()=>{if(confirm('Clear all progress on this device?')){progress={};store.set('progress',{});cur=0;store.set('unit',0);render();}};
applySettings(); render();
</script>
